
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        .container h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .details {
            margin-bottom: 20px;
        }

        .details p {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .details p span {
            font-weight: bold;
            color: #3ab74b;
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            text-decoration: none;
            color: #44b73a;
            font-weight: bold;
        }

        .back-link a:hover {
            color: #2da848;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>User Details</h1>

    <div class="details">
        <p><span>ID:</span> {{ user.id }}</p>
        <p><span>Name:</span> {{ user.username }}</p>
        <p><span>Full Name:</span> {{ user.full_name }}</p>
        <p><span>Phone:</span>{{user.phone_number}}</p>
        <p><span>Email:</span> {{ user.email }}</p>
    </div>

    <div class="back-link">
        <a href="{% url 'manage_user' %}">Back to User List</a>
    </div>
</div>

</body>
</html>
