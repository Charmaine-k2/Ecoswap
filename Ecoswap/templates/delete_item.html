{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Item - EcoSwap</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2e7d32;
        --primary-dark: #1b5e20;
        --accent: #81c784;
        --dark: #263238;
        --light-bg: #e8f5e9;
        --white: #fff;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --bg-color: #f8f9fa;
        --card-bg: #ffffff;
        --text-color: #263238;
      }

      [data-theme="dark"] {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-color: #e0e0e0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .delete-container {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 15px;
        box-shadow: var(--shadow);
        text-align: center;
        max-width: 500px;
        width: 90%;
        animation: fadeInUp 0.5s;
      }

      .warning-icon {
        font-size: 4rem;
        color: #e74c3c;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }

      .delete-container h1 {
        color: #e74c3c;
        margin-bottom: 15px;
        font-size: 1.8rem;
      }

      .delete-container p {
        margin-bottom: 10px;
        color: var(--text-color);
        opacity: 0.8;
      }

      .item-info {
        background: rgba(231, 76, 60, 0.1);
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        border-left: 4px solid #e74c3c;
      }

      .item-info strong {
        color: #e74c3c;
        font-size: 1.2rem;
      }

      .action-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-danger {
        background: #e74c3c;
        color: white;
      }

      .btn-danger:hover {
        background: #c0392b;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: var(--text-color);
        color: var(--card-bg);
        opacity: 0.8;
      }

      .btn-secondary:hover {
        opacity: 1;
        transform: translateY(-2px);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="delete-container">
      <div class="warning-icon">
        <i class="fas fa-exclamation-triangle"></i>
      </div>

      <h1>Delete Item</h1>
      <p>Are you sure you want to delete this item?</p>
      <p>This action cannot be undone.</p>

      <div class="item-info">
        <strong>{{ item.name }}</strong>
        {% if item.description %}
        <p style="margin-top: 8px; font-size: 0.9rem">
          {{ item.description|truncatechars:100 }}
        </p>
        {% endif %}
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="action-buttons">
          <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash"></i> Confirm Delete
          </button>
          <a href="{% url 'manage_items' %}" class="btn btn-secondary">
            <i class="fas fa-times"></i> Cancel
          </a>
        </div>
      </form>
    </div>

    <script>
      // Theme detection
      const currentTheme = localStorage.getItem("theme") || "light";
      if (currentTheme === "dark") {
        document.body.setAttribute("data-theme", "dark");
      }
    </script>
  </body>
</html>
